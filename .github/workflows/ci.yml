name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WPTL_MIN_WP_SOURCE: https://wordpress.org/wordpress-6.5.zip
  WPTL_CURRENT_WP_SOURCE: https://wordpress.org/wordpress-7.1.zip

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: JavaScript and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  wordpress:
    name: WordPress and package matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:wp
      - name: Build candidate package
        run: ./bin/build-release.sh "$(node -p "require('./package.json').version")"
      - name: Test extracted candidate package
        run: ./bin/test-release-package.sh "wp-title-layer-$(node -p "require('./package.json').version").zip"
