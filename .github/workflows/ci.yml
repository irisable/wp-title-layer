name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WPTL_MIN_WP_SOURCE: https://wordpress.org/wordpress-6.5.zip
  WPTL_CURRENT_WP_SOURCE: https://wordpress.org/wordpress-7.1.zip

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: JavaScript and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  wordpress:
    name: WordPress and package matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:wp
      - name: Verify official Kadence title and archive templates
        run: |
          curl --fail --location --output "$RUNNER_TEMP/kadence-1.6.0.zip" https://downloads.wordpress.org/theme/kadence.1.6.0.zip
          ./bin/test-kadence.sh "$RUNNER_TEMP/kadence-1.6.0.zip"
      - name: Build candidate package
        run: bash bin/build-wporg-release.sh
      - name: Test extracted candidate package
        run: ./bin/test-release-package.sh "irisable-title-layer-$(node -p "require('./package.json').version").zip"
      - name: Verify directory rename and legacy coexistence guard
        run: |
          node_modules/.bin/wp-playground-cli php --wp="$WPTL_CURRENT_WP_SOURCE" --php=8.3 --verbosity=quiet \
            --mount="$PWD:/wordpress/wp-content/plugins/irisable-title-layer" \
            -- /wordpress/wp-content/plugins/irisable-title-layer/tests/distribution-smoke.php
